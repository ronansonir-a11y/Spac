name: Test and build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aether-6-web
          path: dist
          retention-days: 14

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1; code=$?; tail -120 build.log; exit $code
        working-directory: android
      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: android/build.log
          retention-days: 7
      - name: Report Gradle failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('android/build.log', 'utf8').slice(-55000);
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body: `Gradle diagnostics for ${context.sha}:\n\n\`\`\`text\n${log}\n\`\`\`` });
      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AETHER-6-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-6-Android-APK
          path: AETHER-6-v1.0.0-debug.apk
          retention-days: 30
