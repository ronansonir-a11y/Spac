name: Test and build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aether-6-web
          path: dist
          retention-days: 14

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx cap sync android
      - run: yes | sdkmanager --licenses > /dev/null
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AETHER-6-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-6-Android-APK
          path: AETHER-6-v1.0.0-debug.apk
          retention-days: 30
